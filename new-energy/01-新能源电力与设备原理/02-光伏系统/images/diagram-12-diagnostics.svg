<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="750" version="1.1" viewBox="0 0 1340 750" width="1340" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#2673d9" /></marker><marker id="arrow-green" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#159a7a" /></marker><marker id="arrow-amber" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#d98b13" /></marker></defs><rect fill="#ffffff" height="750" width="1340" x="0" y="0" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="670.0" y="47">光伏功率异常：从数据到设备行为的核查顺序</text><rect fill="#f0f7ff" height="146" rx="16" ry="16" stroke="#cbd5e1" stroke-width="2" width="382" x="35" y="150" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" text-anchor="middle" x="226.0" y="217.0">1. 数据有效吗？</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="middle" x="226.0" y="253.0">时间戳、0 / null、单位</text><line marker-end="url(#arrow-blue)" stroke="#2673d9" stroke-linecap="round" stroke-width="4" x1="418" x2="472" y1="222" y2="222" /><rect fill="#f0f7ff" height="146" rx="16" ry="16" stroke="#cbd5e1" stroke-width="2" width="382" x="477" y="150" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" text-anchor="middle" x="668.0" y="217.0">2. 输入通道存在吗？</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="middle" x="668.0" y="253.0">安装拓扑、PV1/PV2</text><line marker-end="url(#arrow-blue)" stroke="#2673d9" stroke-linecap="round" stroke-width="4" x1="860" x2="914" y1="222" y2="222" /><rect fill="#f0f7ff" height="146" rx="16" ry="16" stroke="#cbd5e1" stroke-width="2" width="382" x="919" y="150" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" text-anchor="middle" x="1110.0" y="217.0">3. 设备什么状态？</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="middle" x="1110.0" y="253.0">运行、待机、故障、保护</text><path d="M1177,296 L1177,363 L223,363 L223,450" fill="none" marker-end="url(#arrow-green)" stroke="#159a7a" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#edf8f4" height="146" rx="16" ry="16" stroke="#cbd5e1" stroke-width="2" width="382" x="35" y="450" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" text-anchor="middle" x="226.0" y="517.0">4. 允许输出吗？</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="middle" x="226.0" y="553.0">零馈网、限发、功率上限</text><line marker-end="url(#arrow-blue)" stroke="#2673d9" stroke-linecap="round" stroke-width="4" x1="418" x2="472" y1="522" y2="522" /><rect fill="#edf8f4" height="146" rx="16" ry="16" stroke="#cbd5e1" stroke-width="2" width="382" x="477" y="450" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" text-anchor="middle" x="668.0" y="517.0">5. 环境是否变化？</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="middle" x="668.0" y="553.0">辐照、温度、遮挡</text><line marker-end="url(#arrow-blue)" stroke="#2673d9" stroke-linecap="round" stroke-width="4" x1="860" x2="914" y1="522" y2="522" /><rect fill="#edf8f4" height="146" rx="16" ry="16" stroke="#cbd5e1" stroke-width="2" width="382" x="919" y="450" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" text-anchor="middle" x="1110.0" y="517.0">6. 需要进一步诊断？</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="middle" x="1110.0" y="553.0">核对告警、日志、现场</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" text-anchor="middle" x="670" y="679">避免把通讯缺失、运行限功率或天气变化误判为光伏硬件故障</text></svg>