<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="635" version="1.1" viewBox="0 0 1200 635" width="1200" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#2673d9" /></marker><marker id="arrow-green" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#159a7a" /></marker><marker id="arrow-amber" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#d98b13" /></marker></defs><rect fill="#ffffff" height="635" width="1200" x="0" y="0" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="600.0" y="47">零馈网：潜在可发 ≠ 实际发电</text><rect fill="#fff2d9" height="130" rx="16" ry="16" stroke="#efcf94" stroke-width="2" width="225" x="65" y="185" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="177.5" y="244.0">光伏潜在能力</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="middle" x="177.5" y="280.0">5 kW</text><rect fill="#e4f3ff" height="130" rx="16" ry="16" stroke="#b3d5f2" stroke-width="2" width="242" x="405" y="185" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" text-anchor="middle" x="526.0" y="244.0">实际利用的 PV</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="middle" x="526.0" y="280.0">约 2 kW</text><rect fill="#e7f7f0" height="125" rx="16" ry="16" stroke="#cbd5e1" stroke-width="2" width="355" x="773" y="115" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" text-anchor="middle" x="950.5" y="171.5">家庭负载</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="middle" x="950.5" y="207.5">2 kW</text><rect fill="#e7f7f0" height="125" rx="16" ry="16" stroke="#cbd5e1" stroke-width="2" width="355" x="773" y="285" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" text-anchor="middle" x="950.5" y="341.5">电网连接点</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="middle" x="950.5" y="377.5">净馈出目标 0 kW</text><line marker-end="url(#arrow-blue)" stroke="#2673d9" stroke-linecap="round" stroke-width="4" x1="290" x2="405" y1="250" y2="250" /><path d="M647,241 L708,241 L708,176 L773,176" fill="none" marker-end="url(#arrow-green)" stroke="#159a7a" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><path d="M647,265 L708,265 L708,348 L773,348" fill="none" marker-end="url(#arrow-green)" stroke="#159a7a" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#fff5e6" height="94" rx="16" ry="16" stroke="#f2c982" stroke-width="2" width="420" x="400" y="465" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" text-anchor="middle" x="610.0" y="506.0">因系统约束未获取的潜在功率</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="middle" x="610.0" y="542.0">约 3 kW（非实际发电）</text><path d="M177,315 L177,515 L400,515" fill="none" marker-end="url(#arrow-amber)" stroke="#d98b13" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="middle" x="600.0" y="595">控制过程存在延迟与误差；本例忽略损耗且假设电池不允许充电</text></svg>