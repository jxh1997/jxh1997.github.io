<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#2673d9" /></marker><marker id="arrow-green" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#159a7a" /></marker><marker id="arrow-amber" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#d98b13" /></marker></defs><rect fill="#ffffff" height="650" width="1200" x="0" y="0" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="600.0" y="47">同一交流计量边界下的功率平衡</text><rect fill="#e8f2fe" height="130" rx="16" ry="16" stroke="#9dc4ec" stroke-width="2" width="300" x="450" y="250" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="600.0" y="309.0">AC 母线</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="middle" x="600.0" y="345.0">输入 = 输出</text><rect fill="#e5f6ff" height="130" rx="16" ry="16" stroke="#cbd5e1" stroke-width="2" width="238" x="25" y="250" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" text-anchor="middle" x="144.0" y="309.0">光伏逆变器</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="middle" x="144.0" y="345.0">AC 输出 4 kW</text><rect fill="#f4f7fb" height="120" rx="16" ry="16" stroke="#cbd5e1" stroke-width="2" width="245" x="920" y="100" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" text-anchor="middle" x="1042.5" y="154.0">家庭负载</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="middle" x="1042.5" y="190.0">消耗 2 kW</text><rect fill="#f4f7fb" height="120" rx="16" ry="16" stroke="#cbd5e1" stroke-width="2" width="245" x="920" y="266" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" text-anchor="middle" x="1042.5" y="320.0">储能系统</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="middle" x="1042.5" y="356.0">充电 1 kW</text><rect fill="#f4f7fb" height="120" rx="16" ry="16" stroke="#cbd5e1" stroke-width="2" width="245" x="920" y="432" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" text-anchor="middle" x="1042.5" y="486.0">电网连接点</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="middle" x="1042.5" y="522.0">馈出 1 kW</text><line marker-end="url(#arrow-blue)" stroke="#2673d9" stroke-linecap="round" stroke-width="4" x1="263" x2="450" y1="315" y2="315" /><path d="M750,315 L820,315 L820,160 L920,160" fill="none" marker-end="url(#arrow-green)" stroke="#159a7a" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><line marker-end="url(#arrow-green)" stroke="#159a7a" stroke-linecap="round" stroke-width="4" x1="750" x2="920" y1="332" y2="332" /><path d="M750,350 L820,350 L820,491 L920,491" fill="none" marker-end="url(#arrow-green)" stroke="#159a7a" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="28" font-weight="bold" text-anchor="middle" x="600" y="526">4 kW = 2 kW + 1 kW + 1 kW</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="middle" x="600.0" y="595">所有功率属于同一假设 AC 边界并忽略损耗；电池充电和馈网方向在统一符号约定下为负</text></svg>