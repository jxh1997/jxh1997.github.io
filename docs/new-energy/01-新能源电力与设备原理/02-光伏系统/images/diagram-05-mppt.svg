<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="620" version="1.1" viewBox="0 0 1200 620" width="1200" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#2673d9" /></marker><marker id="arrow-green" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#159a7a" /></marker><marker id="arrow-amber" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#d98b13" /></marker></defs><rect fill="#ffffff" height="620" width="1200" x="0" y="0" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="600.0" y="47">MPPT 最大功率点跟踪：反馈控制示意</text><rect fill="#ecf4ff" height="114" rx="16" ry="16" stroke="#cbd5e1" stroke-width="2" width="219" x="45" y="200" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="22" font-weight="bold" text-anchor="middle" x="154.5" y="251.0">测量 PV</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="middle" x="154.5" y="287.0">U（V）、I（A）</text><rect fill="#ecf4ff" height="114" rx="16" ry="16" stroke="#cbd5e1" stroke-width="2" width="219" x="342" y="200" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="22" font-weight="bold" text-anchor="middle" x="451.5" y="251.0">计算功率</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="middle" x="451.5" y="287.0">P = U × I</text><rect fill="#ecf4ff" height="114" rx="16" ry="16" stroke="#cbd5e1" stroke-width="2" width="219" x="639" y="200" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="22" font-weight="bold" text-anchor="middle" x="748.5" y="251.0">调整工作点</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="middle" x="748.5" y="287.0">目标电压 / 电流</text><rect fill="#ecf4ff" height="114" rx="16" ry="16" stroke="#cbd5e1" stroke-width="2" width="219" x="936" y="200" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="22" font-weight="bold" text-anchor="middle" x="1045.5" y="251.0">重新测量</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="middle" x="1045.5" y="287.0">比较前后功率</text><line marker-end="url(#arrow-blue)" stroke="#2673d9" stroke-linecap="round" stroke-width="4" x1="264" x2="341" y1="256" y2="256" /><line marker-end="url(#arrow-blue)" stroke="#2673d9" stroke-linecap="round" stroke-width="4" x1="561" x2="638" y1="256" y2="256" /><line marker-end="url(#arrow-blue)" stroke="#2673d9" stroke-linecap="round" stroke-width="4" x1="858" x2="935" y1="256" y2="256" /><path d="M1042,319 L1042,416 L163,416 L163,319" fill="none" marker-end="url(#arrow-green)" stroke="#159a7a" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><text fill="#159a7a" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" text-anchor="middle" x="600" y="389">连续追踪：辐照 / 温度 / 遮挡变化后重新优化</text><rect fill="#effaf5" height="65" rx="16" ry="16" stroke="#b8dfcf" stroke-width="2" width="580" x="314" y="463" /><text fill="#183153" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" text-anchor="middle" x="604.0" y="495.5">优化目标：当前可用最大功率（受安全与设备上限约束）</text><text fill="#65758b" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="middle" x="600.0" y="595">示意控制闭环，不代表某品牌/型号使用的具体 MPPT 算法</text></svg>